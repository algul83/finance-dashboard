name: Keep Streamlit app awake

# Streamlit Community Cloud는 접속이 없으면 앱을 잠재운다("Zzzz" 화면).
# 6시간마다 실제 브라우저로 접속해 세션을 맺어 잠들지 않게 유지한다.
on:
  schedule:
    - cron: "0 */6 * * *"   # UTC 기준 00/06/12/18시
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright==1.49.1
          playwright install --with-deps chromium

      - name: Ping app
        env:
          APP_URL: https://onesglobal-accounting.streamlit.app
          SCREENSHOT_PATH: keep_awake.png
        run: python scripts/keep_awake.py

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-screenshot
          path: keep_awake.png
          if-no-files-found: ignore
          retention-days: 7
